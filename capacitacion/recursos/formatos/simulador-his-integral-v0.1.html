<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador HIS integral (v0.1, pedagógico)</title>
<style>
:root{--paper:#f6f7f9;--card:#fff;--line:#c9ced8;--ink:#1c3f9c;--text:#1d2330;--mute:#5b6478;--bad:#b3261e;--badbg:#fdecea;--ok:#1b6b3a;--okbg:#e8f5ec;--warn:#8a5a00;--warnbg:#fff4de}
@media (prefers-color-scheme:dark){:root{--paper:#14171d;--card:#1c2029;--line:#3a4152;--ink:#8fb0ff;--text:#e8ebf2;--mute:#9aa3b8;--bad:#ff9d94;--badbg:#3a1f1d;--ok:#8be0a8;--okbg:#17301f;--warn:#ffcf7a;--warnbg:#38290f}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;background:var(--paper);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header,main{max-width:1180px;margin:0 auto;padding:0 14px}
h1{font-size:1.35rem;margin:16px 0 4px}
.nota{color:var(--mute);font-size:.9rem;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
select,button,input{font:inherit}
button,select{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
button.main{background:var(--ink);border-color:var(--ink);color:#fff}
@media (prefers-color-scheme:dark){button.main{color:#10131a}}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
#sheet{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:900px){#sheet{grid-template-columns:1fr 1fr}}
.reg{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}
.reg h2{font-size:.95rem;margin:0 0 8px;display:flex;justify-content:space-between}
.reg.bad{border-color:var(--bad)}
.f{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.f label{font-size:.72rem;color:var(--mute);display:block}
.f input{width:100%;min-height:38px;padding:4px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600}
.f .w2{grid-column:span 2}
.dx{display:grid;grid-template-columns:3fr 1.2fr 1fr 1fr 1.6fr;gap:6px;margin-top:8px;align-items:end}
.dx input{width:100%;min-height:38px;padding:4px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font-weight:600}
.dx .h{font-size:.7rem;color:var(--mute)}
.tp{display:flex;gap:2px}
.tp button{min-height:38px;min-width:34px;padding:0;border-radius:6px;font-weight:700;color:var(--ink)}
.tp button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (prefers-color-scheme:dark){.tp button[aria-pressed=true]{color:#10131a}}
@media (max-width:560px){.f{grid-template-columns:repeat(2,1fr)}.dx{grid-template-columns:1fr 1fr 1fr}.dx>.dxn{grid-column:1/-1}}
#rep{margin:16px 0 40px}
.it{border-left:4px solid;padding:8px 10px;margin:8px 0;border-radius:4px;font-size:.93rem}
.it.e{border-color:var(--bad);background:var(--badbg)}.it.a{border-color:var(--warn);background:var(--warnbg)}.it.o{border-color:var(--ok);background:var(--okbg)}
.src{display:block;color:var(--mute);font-size:.82rem;margin-top:3px}
</style>
</head>

<header>
<h1>Simulador HIS integral · v0.1</h1>
<p class="nota">Uso pedagógico. El HIS real se entrega por escrito con lapicero azul. Revisa solo las actividades que ya tienen ficha verificada (HIS-FICHAS-MOTOR.md v0.3); el resto no se valida.</p>

<button id="add">Añadir registro</button>
<button id="rev" class="main">Revisar hoja</button>
<button id="clr">Limpiar</button>
</div>
</header>

  h+=`<div class="dx" data-j="${j}"><div class="dxn"><span class="h">${j+1}. Diagnóstico / actividad</span><input data-k="dx" value="${esc(x.dx)}"></div>
  <div><span class="h">Tipo</span><div class="tp" data-t="${x.t||""}">${["P","D","R"].map(v=>`<button type="button" aria-pressed="${x.t===v}" data-v="${v}">${v}</button>`).join("")}</div></div>
  <div><span class="h">LAB 1</span><input data-k="a" value="${esc(x.a)}"></div><div><span class="h">LAB 2</span><input data-k="b" value="${esc(x.b)}"></div>
  <div><span class="h">Código</span><input data-k="c" value="${esc(x.c)}"></div></div>`}
 e.innerHTML=h;sheet.appendChild(e);
}
function limpiar(){sheet.innerHTML="";n=0;$("#rep").innerHTML="";const k=matchMedia("(min-width:900px)").matches?22:3;for(let i=0;i<k;i++)reg()}
sheet.addEventListener("click",e=>{const b=e.target.closest(".tp button");if(!b)return;const w=b.parentNode;const on=b.getAttribute("aria-pressed")==="true";w.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));if(!on){b.setAttribute("aria-pressed","true");w.dataset.t=b.dataset.v}else w.dataset.t=""});
$("#add").onclick=()=>{reg();sheet.lastChild.scrollIntoView({behavior:"smooth",block:"center"})};
$("#clr").onclick=limpiar;
$("#caso").onchange=function(){if(this.value==="")return;const c=CASOS[+this.value];sheet.innerHTML="";n=0;$("#rep").innerHTML="";reg(c);reg();reg();this.value=""};
function leer(e){const g=(r,k)=>(r.querySelector(`[data-k="${k}"]`)?.value||"").trim();
 const o={};["dia","hc","fin","etn","dist","edad","sexo","est","serv"].forEach(k=>o[k]=g(e,k));
 o.l=[...e.querySelectorAll(".dx")].map(d=>({dx:g(d,"dx"),t:d.querySelector(".tp").dataset.t||"",a:g(d,"a"),b:g(d,"b"),c:g(d,"c").toUpperCase()}));return o}
const vacio=v=>v===""||v==="/"||v==="-";
function revisar(){
 const out=[];let revisados=0;
 sheet.querySelectorAll(".reg").forEach(e=>{
  const o=leer(e),i=e.dataset.i,msgs=[];e.classList.remove("bad");
  if(!o.hc&&!o.l.some(x=>x.dx||x.c))return;
  const app=/^APP\s?\d+$/i.test(o.hc),dni=/^\d{8}$/.test(o.hc);
  const cods=o.l.filter(x=>R[x.c]);
  if(!cods.length){out.push({i,items:[{k:"a",m:"Sin actividades con ficha: este registro no se valida.",s:""}]});return}
  revisados++;
  cods.forEach(x=>{const r=R[x.c];
   if(r.g===1&&!app)msgs.push({k:"e",m:`${x.c} ${r.n} es una actividad grupal o comunitaria: en HC/DNI va el código APP del grupo, no un DNI.`,s:r.src});
   if(r.g===2){const ind=x.a.toUpperCase()==="ALI";
    if(ind&&!dni)msgs.push({k:"e",m:"Sesión demostrativa individual (LAB 1 = ALI): en HC/DNI va el DNI del niño(a) o de la gestante.",s:r.src});
    if(!ind&&!app)msgs.push({k:"e",m:"Sesión demostrativa grupal: en HC/DNI va el código APP del grupo. Si es individual (6-11 meses o gestante), LAB 1 debe ser ALI.",s:r.src});
    if(!ind&&app&&!/^\d+$/.test(x.a))msgs.push({k:"e",m:"En la sesión grupal, LAB 1 es el n.º de participantes.",s:r.src})}
   if(x.t!=="D"&&(r.g||x.c==="99402.09"||x.c==="99402.14"||/^9615/.test(x.c)||x.c==="Z133"||x.c==="99217"||x.c==="90872"||x.c==="99207.02"||r.d))msgs.push({k:"e",m:`${x.c} ${r.n}: el tipo de diagnóstico va siempre D.`,s:r.src});
   if(r.l1==="num"&&!/^\d+$/.test(x.a))msgs.push({k:"e",m:`${x.c}: LAB 1 debe ser un número (${r.t1}).`,s:r.src});
   if(r.l2==="num"&&!/^\d+$/.test(x.b))msgs.push({k:"e",m:`${x.c}: LAB 2 debe ser un número (${r.t2}).`,s:r.src});
   if(r.l1==="alta"&&!/^[1-5]$/.test(x.a))msgs.push({k:"e",m:"99217: LAB 1 es el tipo de alta, de 1 a 5.",s:r.src});
   if(r.p1&&(x.a||r.req1)&&!r.p1.test(x.a.toUpperCase()))msgs.push({k:"e",m:`${x.c}: LAB 1 debe ser ${r.t1}.`,s:r.src});
   if(r.p2&&(x.b||r.req2)&&!r.p2.test(x.b.toUpperCase()))msgs.push({k:"e",m:`${x.c}: LAB 2 debe ser ${r.t2}.`,s:r.src});
   if(x.c==="C0009"&&!x.b&&!o.l.some(y=>y.c==="U0020"||y.c==="U0009"))msgs.push({k:"a",m:"C0009 suele llevar un 2.º casillero con la estrategia (U0020 Salud Familiar, U0009 Inmunizaciones).",s:r.src});
   if(r.st&&r.st!=="ULTIMA_EDICION_LOCALIZADA")msgs.push({k:"a",m:`Estado de vigencia de la regla: ${r.st}.`,s:r.src});
   if(r.nota)msgs.push({k:"a",m:r.nota,s:r.src});
   if(x.c==="C0005"||x.c==="C0003")if(!/^APP\s?\d+$/i.test(o.hc))msgs.push({k:"e",m:`${x.c}: en HC/DNI va el APP del grupo (APP93, APP144, APP145 o APP146).`,s:r.src});
  });
  if(app){const llenos=GR.filter(k=>!vacio(o[k]));if(llenos.length)msgs.push({k:"e",m:`Actividad con APP: no se registran financiador, etnia, edad, sexo, establecimiento ni servicio (línea oblicua). Tienes datos en: ${llenos.join(", ")}.`,s:"Salud Familiar 2014 p.9 · Inmunizaciones 2019 p.24 · Adulto Mayor 2019 p.23"})}
  if(!msgs.length)msgs.push({k:"o",m:"Sin observaciones según las fichas cargadas.",s:cods.map(x=>R[x.c].src).filter((v,a,b)=>b.indexOf(v)===a).join(" | ")});
  if(msgs.some(m=>m.k==="e"))e.classList.add("bad");
  out.push({i,items:msgs});
 });
 const rep=$("#rep");
 if(!out.length){rep.innerHTML='<div class="it a">La hoja está vacía. Escribe un registro o elige un caso de práctica.</div>';return}
 rep.innerHTML=`<h2 style="font-size:1.05rem">Revisión · ${revisados} registro(s) con ficha</h2>`+out.map(r=>`<h3 style="font-size:.95rem;margin:14px 0 2px">Registro ${r.i}</h3>`+r.items.map(m=>`<div class="it ${m.k}">${esc(m.m)}${m.s?`<span class="src">Fuente: ${esc(m.s)}</span>`:""}</div>`).join("")).join("");
 rep.scrollIntoView({behavior:"smooth",block:"start"});
}
$("#rev").onclick=revisar;
limpiar();
</script>
</body>
</html>
