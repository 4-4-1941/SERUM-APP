const normalize=s=>(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
async function sha256(url){
  const r=await fetch(url);
  if(!r.ok) throw new Error("No se pudo cargar "+url);
  const b=await r.arrayBuffer();
  const h=await crypto.subtle.digest("SHA-256",b);
  return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
async function build(){
  const byHash=new Map(catalog.filter(x=>x.hash).map(x=>[x.hash,x]));
  const found=[], unmatched=[];
  for(const file of physicalFiles){
    try{
      const url="flashcards/"+encodeURIComponent(file);
      const hash=await sha256(url);
      const m=byHash.get(hash);
      if(m) found.push({...m,file});
      else unmatched.push(file);
    }catch(e){ unmatched.push(file); }
  }
  // La única tarjeta fuera del ZIP maestro de 50 corresponde a la ficha 51.
  if(unmatched.length===1){
    const m=catalog.find(x=>x.n===51);
    found.push({...m,file:unmatched[0]});
  }
  found.sort((a,b)=>a.n-b.n);
  window.cards=found;
  setupFilters(found);
  render();
  const missing=51-found.length;
  document.getElementById("status").textContent=missing
    ? `${found.length} identificadas · ${missing} pendiente(s) de asociación`
    : "51 tarjetas identificadas y ordenadas";
}
function setupFilters(cards){
  const eje=document.getElementById("eje"), tema=document.getElementById("tema");
  [...new Set(cards.map(x=>x.eje))].sort().forEach(v=>eje.add(new Option(v,v)));
  function refill(){
    const selected=eje.value;
    const current=tema.value;
    tema.innerHTML='<option value="">Todos los temas</option>';
    cards.filter(x=>!selected||x.eje===selected).sort((a,b)=>a.n-b.n)
      .forEach(x=>tema.add(new Option(`${String(x.n).padStart(2,"0")} · ${x.title}`,String(x.n))));
    if([...tema.options].some(o=>o.value===current)) tema.value=current;
  }
  eje.addEventListener("change",()=>{refill();render();});
  tema.addEventListener("change",render);
  document.getElementById("q").addEventListener("input",render);
  refill();
}
function render(){
  const cards=window.cards||[];
  const q=normalize(document.getElementById("q").value);
  const eje=document.getElementById("eje").value;
  const tema=document.getElementById("tema").value;
  const list=cards.filter(x=>{
    const hay=normalize(`${x.n} ${x.title} ${x.eje} ${x.topic}`);
    return (!q||hay.includes(q))&&(!eje||x.eje===eje)&&(!tema||String(x.n)===tema);
  });
  const grid=document.getElementById("grid"); grid.replaceChildren();
  list.forEach(x=>{
    const article=document.createElement("article"); article.className="card";
    const head=document.createElement("div"); head.className="head";
    const num=document.createElement("div"); num.className="num"; num.textContent=`${String(x.n).padStart(2,"0")} · ${x.eje}`;
    const title=document.createElement("div"); title.className="title"; title.textContent=x.title;
    const tags=document.createElement("div"); tags.className="tags";
    const tag=document.createElement("span"); tag.className="tag"; tag.textContent=x.eje; tags.append(tag);
    head.append(num,title,tags);
    const img=document.createElement("img"); img.src="flashcards/"+encodeURIComponent(x.file); img.alt=`${x.n}. ${x.title}`; img.loading="lazy"; img.decoding="async";
    const foot=document.createElement("div"); foot.className="foot"; foot.textContent="Fundamento oficial: vínculo documental pendiente de incorporación verificada.";
    article.append(head,img,foot); grid.append(article);
  });
  document.getElementById("empty").style.display=list.length?"none":"block";
}
build().catch(e=>{document.getElementById("status").textContent="Error al identificar las tarjetas: "+e.message;});
</script>
