<title>SIP SERUMS PERÚ · 51 Flashcards visuales</title>
<style>
:root{--ink:#15324a;--blue:#176b87;--green:#2f8f72;--line:#d8e5e8}
*{box-sizing:border-box}
body{margin:0;background:#edf3f4;color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px}
header strong{display:block;font-size:18px} header span{font-size:12px;color:#607782}
main{max-width:1050px;margin:auto;padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px #173b4d12}
.card img{display:block;width:100%;height:auto;background:#f6f8f9}
.meta{padding:10px 12px 13px}.meta b{color:var(--blue)}.meta small{display:block;color:#607782;margin-top:3px;overflow-wrap:anywhere}
.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px}
@media(max-width:600px){main{padding:8px}.grid{grid-template-columns:1fr;gap:10px}.card{border-radius:12px}}
</style>
</head>
<body>
