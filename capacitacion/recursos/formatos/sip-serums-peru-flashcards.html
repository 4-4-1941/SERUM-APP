window.SIP_FLASHCARDS = flashcards;

const REPO_RAW = 'https://raw.githubusercontent.com/4-4-1941/SERUM-APP/main/capacitacion/recursos/formatos/flashcards/';
const PDF_HEADER = '\u00AESIP SYSTEM INTELLIGENCE PLATFORM - SERUMS APP PER\u00DA';
const NOTA = 'Material pedag\u00F3gico. No sustituye la norma oficial vigente.';
const $ = id => document.getElementById(id);
const rel = f => 'flashcards/' + encodeURIComponent(f.archivo);
const raw = f => REPO_RAW + encodeURIComponent(f.archivo);
const ejeTxt = f => f.eje || 'Eje por revisar';
let idx = 0;

function toast(m,ms){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);if(ms)toast.h=setTimeout(()=>t.style.display='none',ms);}

/* imagen visible: ruta relativa; si no existe (vista previa), copia del repositorio */
function ponerImg(img,f){
  img.onerror=()=>{ if(img.dataset.fb) return; img.dataset.fb='1'; img.src=raw(f); };
  delete img.dataset.fb; img.src=rel(f);
}
async function obtenerBlob(f){
  for(const u of [rel(f),raw(f)]){
    try{ const r=await fetch(u); if(r.ok) return await r.blob(); }catch(e){}
  }
  throw new Error('No se pudo leer la imagen');
}
function guardar(blob,nombre){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=nombre; document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}

/*PDFSTART*/
const _enc = s => Uint8Array.from(Array.from(s.replace(/\u2260/g,'vs')).map(c=>{const k=c.charCodeAt(0);return k<256?k:63;}));
const _esc = s => s.replace(/[\\()]/g,'\\$&');
function buildPdf(jpg,w,h,cab,der,pie1,pie2){
  const land=w>=h, W=land?842:595, H=land?595:842, BAR=34, M=20, FOOT=40;
  const k=Math.min((W-2*M)/w,(H-BAR-12-FOOT-12)/h), dw=w*k, dh=h*k;
  const x=(W-dw)/2, y=FOOT+((H-BAR-12-FOOT-12)-dh)/2;
  const f2=n=>n.toFixed(2);
  const cont=
   '0.082 0.196 0.29 rg 0 '+f2(H-BAR)+' '+W+' '+BAR+' re f\n'+
   'BT /F1 12 Tf 1 1 1 rg 20 '+f2(H-22)+' Td ('+_esc(cab)+') Tj ET\n'+
   'BT /F1 10 Tf 1 1 1 rg '+f2(W-80)+' '+f2(H-22)+' Td ('+_esc(der)+') Tj ET\n'+
   'q '+f2(dw)+' 0 0 '+f2(dh)+' '+f2(x)+' '+f2(y)+' cm /Im0 Do Q\n'+
   'BT /F1 9 Tf 0.24 0.27 0.31 rg 20 24 Td ('+_esc(pie1)+') Tj ET\n'+
   'BT /F1 8 Tf 0.24 0.27 0.31 rg 20 12 Td ('+_esc(pie2)+') Tj ET\n';
  const contB=_enc(cont), parts=[], offs=[]; let len=0;
  const put=b=>{const u=typeof b==='string'?_enc(b):b; parts.push(u); len+=u.length;};
  const obj=(n,body)=>{offs[n]=len; put(n+' 0 obj\n'); body.forEach(put); put('\nendobj\n');};
  put('%PDF-1.4\n');
  obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
  obj(2,['<< /Type /Pages /Kids [3 0 R] /Count 1 >>']);
  obj(3,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /Font << /F1 6 0 R >> /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>']);
  obj(4,['<< /Length '+contB.length+' >>\nstream\n',contB,'\nendstream']);
  obj(5,['<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n',jpg,'\nendstream']);
  obj(6,['<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>']);
  const xr=len; put('xref\n0 7\n0000000000 65535 f \n');
  for(let i=1;i<=6;i++) put(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
  const out=new Uint8Array(len); let p=0; parts.forEach(u=>{out.set(u,p);p+=u.length;});
  return out;
}
/*PDFEND*/

async function pdf(f){
  toast('Generando PDF\u2026');
  try{
    const blob=await obtenerBlob(f), url=URL.createObjectURL(blob);
    const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('img'));i.src=url;});
    const w=im.naturalWidth,h=im.naturalHeight, cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0); URL.revokeObjectURL(url);
    const b64=cv.toDataURL('image/jpeg',0.92).split(',')[1], bin=atob(b64), jpg=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) jpg[i]=bin.charCodeAt(i);
    const out=buildPdf(jpg,w,h,PDF_HEADER,'Ficha '+f.codigo,ejeTxt(f)+' - '+f.titulo,NOTA);
    guardar(new Blob([out],{type:'application/pdf'}),'SIP-SERUMS-ficha-'+f.codigo+'.pdf');
    toast('PDF listo',2500);
  }catch(e){ toast('No se pudo generar el PDF. Verifique su conexi\u00F3n e intente de nuevo.',4500); }
}
async function png(f){
  try{ guardar(await obtenerBlob(f),'SIP-SERUMS-ficha-'+f.codigo+'.png'); }
  catch(e){ toast('No se pudo descargar la imagen.',3500); }
}

/* rejilla */
const grid=$('grid');
$('count').textContent=`${flashcards.length} fichas disponibles`;
flashcards.forEach((f,i)=>{
  const c=document.createElement('article'); c.className='card';
  const op=document.createElement('button'); op.type='button'; op.className='open'; op.setAttribute('aria-label','Abrir ficha '+f.codigo+': '+f.titulo);
  const im=document.createElement('img'); im.alt='Ficha '+f.codigo+': '+f.titulo; im.loading='lazy'; im.decoding='async'; ponerImg(im,f);
  op.append(im); op.onclick=()=>abrir(i);
  const m=document.createElement('div'); m.className='meta';
  const b=document.createElement('b'); b.textContent='Ficha '+f.codigo;
  const t=document.createElement('span'); t.className='t'; t.textContent=f.titulo;
  const s=document.createElement('small'); s.textContent=ejeTxt(f)+' \u00B7 '+f.tema;
  m.append(b,t,s);
  if(f.estado==='REVISAR'){const r=document.createElement('span'); r.className='rev'; r.textContent='Eje pendiente de revisi\u00F3n manual'; m.append(r);}
  const a=document.createElement('div'); a.className='acts';
  const bo=document.createElement('button'); bo.type='button'; bo.className='btn alt'; bo.textContent='Abrir'; bo.onclick=()=>abrir(i);
  const bp=document.createElement('button'); bp.type='button'; bp.className='btn'; bp.textContent='\u2B07 PDF'; bp.onclick=()=>pdf(f);
  a.append(bo,bp); c.append(op,m,a); grid.append(c);
});

/* visor individual */
function mostrar(){
  const f=flashcards[idx];
  ponerImg($('lbImg'),f); $('lbImg').alt='Ficha '+f.codigo+': '+f.titulo;
  $('lbT').textContent='Ficha '+f.codigo+' \u00B7 '+f.titulo;
  $('lbS').textContent=ejeTxt(f)+' \u00B7 '+f.tema;
}
function abrir(i){idx=i;mostrar();$('lb').classList.add('on');document.body.style.overflow='hidden';}
function cerrar(){$('lb').classList.remove('on');document.body.style.overflow='';}
function mover(d){idx=(idx+d+flashcards.length)%flashcards.length;mostrar();}
$('lbX').onclick=cerrar; $('lbP').onclick=()=>mover(-1); $('lbN').onclick=()=>mover(1);
$('lbPdf').onclick=()=>pdf(flashcards[idx]); $('lbPng').onclick=()=>png(flashcards[idx]);
document.addEventListener('keydown',e=>{if(!$('lb').classList.contains('on'))return;if(e.key==='Escape')cerrar();if(e.key==='ArrowLeft')mover(-1);if(e.key==='ArrowRight')mover(1);});
</script>
