    // STATE
    let state = {
      currentCase: 0,
      currentPhase: 0,
      decisions: {},
      feedback: null,
      caseCompleted: false,
      showReport: false
    };

    // HELPERS
    function calculateScore() {
      return Object.values(state.decisions).reduce((sum, d) => sum + (d?.correct ? 10 : 0), 0);
    }

    function handleDecision(decision) {
      const key = `caso${state.currentCase}-fase${state.currentPhase}`;
      state.decisions[key] = decision;
      state.feedback = {
        isCorrect: decision.correct,
        explanation: decision.explanation
      };
      render();
    }

    function handleNextPhase() {
      const caseData = cases[state.currentCase];
      if (state.currentPhase < caseData.phases.length - 1) {
        state.currentPhase++;
        state.feedback = null;
      } else {
        state.caseCompleted = true;
      }
      render();
    }

    function handleNextCase() {
      if (state.currentCase < cases.length - 1) {
        state.currentCase++;
        state.currentPhase = 0;
        state.caseCompleted = false;
        state.feedback = null;
      } else {
        state.showReport = true;
      }
      render();
    }

    function handleReset() {
      state = {
        currentCase: 0,
        currentPhase: 0,
        decisions: {},
        feedback: null,
        caseCompleted: false,
        showReport: false
      };
      render();
    }

    // RENDER
    function render() {
      const app = document.getElementById('app');

      if (state.showReport) {
        const totalScore = calculateScore();
        const maxScore = cases.reduce((sum, c) => sum + c.phases.length * 10, 0);
        const percentage = Math.round((totalScore / maxScore) * 100);

        app.innerHTML = `
          <div class="max-w-4xl mx-auto p-6 min-h-screen">
            <div class="bg-white rounded-lg shadow-xl p-8">
              <h1 class="text-3xl font-bold text-indigo-900 mb-2">REPORTE FINAL</h1>
              <p class="text-gray-600 mb-8">Simulador de Referencia/Contrarreferencia MINSA 2025</p>
              
              <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="bg-indigo-100 rounded-lg p-6 border-2 border-indigo-400">
                  <p class="text-sm text-indigo-700 font-semibold">PUNTUACIÓN</p>
                  <p class="text-4xl font-bold text-indigo-900">${totalScore}/${maxScore}</p>
                  <p class="text-xs text-indigo-600 mt-1">${percentage}% de aciertos</p>
                </div>
                
                <div class="bg-green-100 rounded-lg p-6 border-2 border-green-400">
                  <p class="text-sm text-green-700 font-semibold">CASOS COMPLETADOS</p>
                  <p class="text-4xl font-bold text-green-900">${cases.length}/3</p>
                  <p class="text-xs text-green-600 mt-1">Decisiones validadas</p>
                </div>
                
                <div class="bg-purple-100 rounded-lg p-6 border-2 border-purple-400">
                  <p class="text-sm text-purple-700 font-semibold">DESEMPEÑO</p>
                  <p class="text-4xl font-bold text-purple-900">
                    ${totalScore >= 28 ? '🟢 EXCELENTE' : totalScore >= 21 ? '🟡 BUENO' : '🔴 REVISAR'}
                  </p>
                </div>
              </div>

              <div class="bg-blue-50 rounded-lg p-6 border-l-4 border-blue-500 mb-8">
                <h3 class="font-semibold text-blue-900 mb-3">📋 RECOMENDACIONES</h3>
                <p class="text-blue-800">
                  ${totalScore >= 28 
                    ? '<strong>Desempeño excelente.</strong> Demuestras comprensión sólida del protocolo MINSA 2025. Puedes avanzar al módulo quiz avanzado.'
                    : totalScore >= 21
                    ? '<strong>Buen desempeño.</strong> Captas los conceptos clave. Revisa casos con errores y repite el simulador.'
                    : '<strong>Revisar conceptos.</strong> Requiere reaprendizaje. Repite el simulador y consulta el manual MINSA secciones C.5-C.6.'}
                </p>
              </div>

              <button onclick="window.location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition">
                🔄 Reiniciar Simulador
              </button>
            </div>
          </div>
        `;
        return;
      }

      if (state.feedback) {
        const isCorrect = state.feedback.isCorrect;
        app.innerHTML = `
          <div class="max-w-4xl mx-auto p-6 min-h-screen">
            <div class="${isCorrect ? 'bg-green-50 border-2 border-green-500' : 'bg-red-50 border-2 border-red-500'} rounded-lg shadow-xl p-8">
              
              <div class="flex items-start gap-4 mb-6">
                <div>${isCorrect ? '✓' : '✗'}</div>
                <div>
                  <h2 class="text-2xl font-bold ${isCorrect ? 'text-green-900' : 'text-red-900'}">
                    ${isCorrect ? '✓ CORRECTO' : '✗ INCORRECTO'}
                  </h2>
                </div>
              </div>

              <div class="bg-white rounded-lg p-6 mb-6 border-l-4 border-gray-400">
                <p class="whitespace-pre-line text-gray-800 text-sm leading-relaxed font-mono">
                  ${state.feedback.explanation}
                </p>
              </div>

              <button onclick="handleNextPhase()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition">
                ${state.caseCompleted ? 'Siguiente Caso' : 'Siguiente Fase'} →
              </button>
            </div>
          </div>
        `;
        return;
      }

      // RENDER PHASE
      const caseData = cases[state.currentCase];
      const phaseData = caseData.phases[state.currentPhase];
      const totalPhases = caseData.phases.length * cases.length;
      const currentPhaseNum = state.currentCase * caseData.phases.length + state.currentPhase + 1;
      const progressPercent = (currentPhaseNum / totalPhases) * 100;

      app.innerHTML = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="bg-white rounded-lg shadow-lg p-6 mb-6 border-l-4 border-indigo-600">
            <div class="flex justify-between items-start mb-4">
              <div>
                <p class="text-xs font-semibold text-indigo-600 uppercase">CASO ${state.currentCase + 1}/3</p>
                <h1 class="text-2xl font-bold text-gray-900">${caseData.name}</h1>
                <p class="text-sm text-gray-600 mt-1">${caseData.patient}</p>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-500 uppercase">FASE ${state.currentPhase + 1}/${caseData.phases.length}</p>
                <p class="text-2xl font-bold text-indigo-900">${phaseData.month}</p>
              </div>
            </div>
            
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div class="bg-indigo-600 h-2 rounded-full transition-all" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold text-indigo-900 mb-4">${phaseData.title}</h2>
            <div class="bg-blue-50 border-l-4 border-blue-500 p-4 rounded">
              <p class="text-gray-800 whitespace-pre-line font-mono text-sm leading-relaxed">
                ${phaseData.context}
              </p>
            </div>
          </div>

          <div class="space-y-3">
            <p class="text-sm font-semibold text-gray-700 uppercase">¿Cuál es la decisión clínica correcta?</p>
            ${phaseData.decisions.map((decision, idx) => `
              <button onclick="handleDecision(${idx})" class="w-full text-left bg-white rounded-lg shadow-md p-4 border-2 border-gray-300 hover:border-indigo-500 hover:shadow-lg transition-all active:scale-95">
                <p class="font-semibold text-gray-900">${decision.text}</p>
              </button>
            `).join('')}
          </div>

          <div class="mt-8 text-center text-xs text-gray-600">
            <p>Simulador de Referencia/Contrarreferencia • Manual MINSA 2025</p>
          </div>
        </div>
      `;
    }

    // GLOBAL FUNCTIONS
    window.handleDecision = function(idx) {
      const phaseData = cases[state.currentCase].phases[state.currentPhase];
      handleDecision(phaseData.decisions[idx]);
    };

    window.handleNextPhase = function() {
      handleNextPhase();
    };

    window.handleNextCase = function() {
      handleNextCase();
    };

    window.handleReset = function() {
      handleReset();
    };

    // INITIAL RENDER
    render();
  </script>
</body>
</html>
