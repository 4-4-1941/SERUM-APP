          { text: "DIAGNÓSTICO CIE-10 + FECHA (aproximada) + ESTADO ACTUAL (curado/remisión/secuelas) + MEDICACIÓN RECIBIDA", correct: true },
          { text: "Fecha y nada más", correct: false },
          { text: "No es necesario registrar antecedentes en Carnet", correct: false }
        ],
        explanation: `✓ CORRECTO: Registro INTEGRAL de antecedentes patológicos.

SECCIÓN ANTECEDENTES PATOLÓGICOS - QUÉ INCLUIR:

1. DIAGNÓSTICO CIE-10:
   No solo "tuberculosis" sino "Tuberculosis pulmonar (A15.0)"
   Especificidad es clave para:
   - Vigilancia epidemiológica
   - Reporte a DIRESA si reaparece
   - Evaluación de riesgo futuro

2. FECHA APROXIMADA:
   Ejemplo: "Enero 2022" o "Hace 2 años"
   Permite:
   - Calcular tiempo desde curación
   - Vigilancia según protocolo
   - Planificar seguimiento

3. ESTADO ACTUAL:
   ✓ Curado completamente
   ✓ En remisión (bajo tratamiento)
   ✓ Con secuelas (especificar cuáles)
   ✓ Recurrencia (si reaparece)
   
   Ejemplo: "Tuberculosis pulmonar curada tras completar tratamiento 2019"

4. MEDICACIÓN RECIBIDA:
   Importante para:
   - Calcular dosis acumuladas (ej: rifampicina)
   - Evaluación de efectos adversos previos
   - Evitar repetir mismos fármacos si tolerancia baja
   
   Ejemplo: "Esquema RIPE: Rifampicina, isoniazida, pirazinamida, etambutol"

5. SEGUIMIENTO POST-TRATAMIENTO:
   ✓ Última evaluación/control
   ✓ Resultado de evaluaciones (radiografía, laboratorio)
   ✓ Recomendaciones futuras

EJEMPLO COMPLETO:
"ANTECEDENTES PATOLÓGICOS:
- Tuberculosis pulmonar (A15.0)
  Diagnóstico: Enero 2022
  Tratamiento: Esquema RIPE, 6 meses
  Estado actual: Curado (Dic 2022). Radiografía control: sin infiltrados.
  Seguimiento: Radiografía anual por 2 años. Próxima evaluación: Enero 2025.

- Otitis media aguda recurrente (H66.9)
  Antecedente: 2 episodios (2021-2022)
  Estado actual: Resuelto. Sin secuelas auditivas.
  Recomendación: Control ORL anual."

PROTOCOLO MINSA: Documentación de antecedentes patológicos`
      }
    ];

    // STATE
    let state = {
      currentQuestion: 0,
      answers: {},
      feedback: null,
      showResults: false
    };

    function handleAnswer(optionIndex) {
      const question = questions[state.currentQuestion];
      const selectedOption = question.options[optionIndex];

      state.answers[state.currentQuestion] = {
        selectedOption: selectedOption,
        correct: selectedOption.correct
      };

      state.feedback = {
        isCorrect: selectedOption.correct,
        explanation: question.explanation
      };

      render();
    }

    function handleNextQuestion() {
      if (state.currentQuestion < questions.length - 1) {
        state.currentQuestion++;
        state.feedback = null;
      } else {
        state.showResults = true;
      }
      render();
    }

    function calculateScore() {
      let correct = 0;
      for (let i = 0; i < questions.length; i++) {
        if (state.answers[i]?.correct) correct++;
      }
      return correct;
    }

    function handleReset() {
      state = {
        currentQuestion: 0,
        answers: {},
        feedback: null,
        showResults: false
      };
      render();
    }

    // RENDER RESULTS
    function renderResults() {
      const totalCorrect = calculateScore();
      const percentage = Math.round((totalCorrect / questions.length) * 100);
      const passed = totalCorrect >= 12;

      const html = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="bg-white rounded-lg shadow-xl p-8">
            <h1 class="text-3xl font-bold text-cyan-900 mb-2">REPORTE FINAL</h1>
            <p class="text-gray-600 mb-8">Quiz: Manual Registro y Codificación - Etapa Niño</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              <div class="bg-cyan-100 rounded-lg p-6 border-2 border-cyan-400">
                <p class="text-sm text-cyan-700 font-semibold">PUNTUACIÓN</p>
                <p class="text-4xl font-bold text-cyan-900">${totalCorrect}/15</p>
                <p class="text-xs text-cyan-600 mt-1">${percentage}% de aciertos</p>
              </div>
              
              <div class="bg-green-100 rounded-lg p-6 border-2 border-green-400">
                <p class="text-sm text-green-700 font-semibold">CRITERIO DE PASO</p>
                <p class="text-2xl font-bold text-green-900">12/15 (80%)</p>
                <p class="text-xs text-green-600 mt-1">${passed ? '✅ APROBADO' : '❌ REQUIERE REPASO'}</p>
              </div>
              
              <div class="bg-purple-100 rounded-lg p-6 border-2 border-purple-400">
                <p class="text-sm text-purple-700 font-semibold">COMPETENCIA</p>
                <p class="text-2xl font-bold text-purple-900">${passed ? '🟢 DEMOSTRADA' : '🔴 EN CONSTRUCCIÓN'}</p>
              </div>
            </div>

            <button onclick="window.location.reload()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-lg transition">
              🔄 Reiniciar Quiz
            </button>
          </div>
        </div>
      `;
      return html;
    }

    // RENDER FEEDBACK
    function renderFeedback() {
      const question = questions[state.currentQuestion];
      const answer = state.answers[state.currentQuestion];

      const html = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="${answer.correct ? 'bg-green-50 border-2 border-green-500' : 'bg-red-50 border-2 border-red-500'} rounded-lg shadow-xl p-8">
            
            <div class="flex items-start gap-4 mb-6">
              <div class="text-4xl">${answer.correct ? '✓' : '✗'}</div>
              <div>
                <h2 class="text-2xl font-bold ${answer.correct ? 'text-green-900' : 'text-red-900'}">
                  ${answer.correct ? '✓ CORRECTO' : '✗ INCORRECTO'}
                </h2>
                <p class="text-sm mt-1 ${answer.correct ? 'text-green-700' : 'text-red-700'}">
                  Pregunta ${state.currentQuestion + 1}/15
                </p>
              </div>
            </div>

            <div class="bg-white rounded-lg p-6 mb-6 border-l-4 border-gray-400">
              <p class="whitespace-pre-line text-gray-800 text-sm leading-relaxed font-mono">
                ${state.feedback.explanation}
              </p>
            </div>

            <button onclick="handleNextQuestion()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-lg transition">
              ${state.currentQuestion < questions.length - 1 ? 'Siguiente Pregunta' : 'Ver Resultados'} →
            </button>
          </div>
        </div>
      `;
      return html;
    }

    // RENDER QUESTION
    function renderQuestion() {
      const question = questions[state.currentQuestion];
      const progressPercent = ((state.currentQuestion + 1) / questions.length) * 100;

      const html = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="bg-white rounded-lg shadow-lg p-6 mb-6 border-l-4 border-cyan-600">
            <div class="flex justify-between items-start mb-4">
              <div>
                <p class="text-xs font-semibold text-cyan-600 uppercase">Pregunta ${state.currentQuestion + 1}/15</p>
                <p class="text-sm text-gray-600 mt-1">${question.category}</p>
              </div>
            </div>
            
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div class="bg-cyan-600 h-2 rounded-full transition-all" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-6 leading-relaxed">${question.question}</h2>
            
            <div class="space-y-3">
              ${question.options.map((option, idx) => `
                <button onclick="handleAnswer(${idx})" class="w-full text-left bg-gray-50 rounded-lg border-2 border-gray-300 hover:border-cyan-500 hover:bg-cyan-50 p-4 transition-all active:scale-95">
                  <p class="font-semibold text-gray-900">${String.fromCharCode(65 + idx)}) ${option.text}</p>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="text-center text-xs text-gray-600">
            <p>Quiz • Criterio de paso: 12/15 (80%)</p>
          </div>
        </div>
      `;
      return html;
    }

    // MAIN RENDER
    function render() {
      const app = document.getElementById('app');
      
      if (state.showResults) {
        app.innerHTML = renderResults();
      } else if (state.feedback) {
        app.innerHTML = renderFeedback();
      } else {
        app.innerHTML = renderQuestion();
      }
    }

    // GLOBAL FUNCTIONS
    window.handleAnswer = handleAnswer;
    window.handleNextQuestion = handleNextQuestion;
    window.handleReset = handleReset;

    // INITIAL RENDER
    render();
  </script>
</body>
</html>
