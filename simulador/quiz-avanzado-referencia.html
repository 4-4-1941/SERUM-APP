    // STATE
    let state = {
      currentQuestion: 0,
      answers: {},
      feedback: null,
      showResults: false
    };

    function handleAnswer(optionIndex) {
      const question = questions[state.currentQuestion];
      const selectedOption = question.options[optionIndex];

      state.answers[state.currentQuestion] = {
        selectedOption: selectedOption,
        correct: selectedOption.correct
      };

      state.feedback = {
        isCorrect: selectedOption.correct,
        explanation: question.explanation,
        pointsEarned: selectedOption.correct ? 1 : 0
      };

      render();
    }

    function handleNextQuestion() {
      if (state.currentQuestion < questions.length - 1) {
        state.currentQuestion++;
        state.feedback = null;
      } else {
        state.showResults = true;
      }
      render();
    }

    function calculateScore() {
      let correct = 0;
      for (let i = 0; i < questions.length; i++) {
        if (state.answers[i]?.correct) correct++;
      }
      return correct;
    }

    function handleReset() {
      state = {
        currentQuestion: 0,
        answers: {},
        feedback: null,
        showResults: false
      };
      render();
    }

    // RENDER RESULTS
    function renderResults() {
      const totalCorrect = calculateScore();
      const percentage = Math.round((totalCorrect / questions.length) * 100);
      const passed = totalCorrect >= 12; // 80%

      const html = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="bg-white rounded-lg shadow-xl p-8">
            <h1 class="text-3xl font-bold text-indigo-900 mb-2">REPORTE FINAL</h1>
            <p class="text-gray-600 mb-8">Quiz Avanzado: Referencia/Contrarreferencia MINSA 2025</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              <div class="bg-indigo-100 rounded-lg p-6 border-2 border-indigo-400">
                <p class="text-sm text-indigo-700 font-semibold">PUNTUACIÓN</p>
                <p class="text-4xl font-bold text-indigo-900">${totalCorrect}/15</p>
                <p class="text-xs text-indigo-600 mt-1">${percentage}% de aciertos</p>
              </div>
              
              <div class="bg-green-100 rounded-lg p-6 border-2 border-green-400">
                <p class="text-sm text-green-700 font-semibold">CRITERIO DE PASO</p>
                <p class="text-2xl font-bold text-green-900">12/15 (80%)</p>
                <p class="text-xs text-green-600 mt-1">${passed ? '✅ APROBADO' : '❌ REQUIERE REPASO'}</p>
              </div>
              
              <div class="bg-purple-100 rounded-lg p-6 border-2 border-purple-400">
                <p class="text-sm text-purple-700 font-semibold">COMPETENCIA</p>
                <p class="text-2xl font-bold text-purple-900">${passed ? '🟢 DEMOSTRADA' : '🔴 EN CONSTRUCCIÓN'}</p>
              </div>
            </div>

            <div class="mb-8 bg-gray-50 rounded-lg p-6 border-l-4 border-indigo-500">
              <h2 class="text-lg font-semibold text-gray-800 mb-4">ANÁLISIS POR CATEGORÍA</h2>
              <div class="space-y-3">
                <div class="flex justify-between items-center pb-2 border-b">
                  <p class="font-semibold text-gray-800">Códigos MINSA (5 pregs)</p>
                  <p class="font-bold text-indigo-900">${sumCategoryCorrect(0, 4)}/5</p>
                </div>
                <div class="flex justify-between items-center pb-2 border-b">
                  <p class="font-semibold text-gray-800">Casos Breves (5 pregs)</p>
                  <p class="font-bold text-indigo-900">${sumCategoryCorrect(5, 9)}/5</p>
                </div>
                <div class="flex justify-between items-center pb-2 border-b">
                  <p class="font-semibold text-gray-800">Viñetas Clínicas (3 pregs)</p>
                  <p class="font-bold text-indigo-900">${sumCategoryCorrect(10, 12)}/3</p>
                </div>
                <div class="flex justify-between items-center">
                  <p class="font-semibold text-gray-800">Validación Documentación (2 pregs)</p>
                  <p class="font-bold text-indigo-900">${sumCategoryCorrect(13, 14)}/2</p>
                </div>
              </div>
            </div>

            <div class="${passed ? 'bg-green-50' : 'bg-blue-50'} rounded-lg p-6 border-l-4 ${passed ? 'border-green-500' : 'border-blue-500'} mb-8">
              <h3 class="font-semibold ${passed ? 'text-green-900' : 'text-blue-900'} mb-3">📋 RECOMENDACIONES</h3>
              <p class="${passed ? 'text-green-800' : 'text-blue-800'}">
                ${passed 
                  ? '<strong>¡FELICIDADES!</strong> Demostraste competencia en protocolos de referencia/contrarreferencia MINSA. Estás listo para aplicar estos conocimientos en formación de otros profesionales.'
                  : '<strong>Sigue practicando.</strong> Revisa las preguntas donde fallaste. El simulador y este quiz son complementarios: juntos construyen maestría. Repite en 1 semana.'}
              </p>
            </div>

            <button onclick="window.location.reload()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition">
              🔄 Reiniciar Quiz
            </button>
          </div>
        </div>
      `;
      return html;
    }

    function sumCategoryCorrect(start, end) {
      let count = 0;
      for (let i = start; i <= end; i++) {
        if (state.answers[i]?.correct) count++;
      }
      return count;
    }

    // RENDER FEEDBACK
    function renderFeedback() {
      const question = questions[state.currentQuestion];
      const answer = state.answers[state.currentQuestion];

      const html = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="${answer.correct ? 'bg-green-50 border-2 border-green-500' : 'bg-red-50 border-2 border-red-500'} rounded-lg shadow-xl p-8">
            
            <div class="flex items-start gap-4 mb-6">
              <div class="text-4xl">${answer.correct ? '✓' : '✗'}</div>
              <div>
                <h2 class="text-2xl font-bold ${answer.correct ? 'text-green-900' : 'text-red-900'}">
                  ${answer.correct ? '✓ CORRECTO' : '✗ INCORRECTO'}
                </h2>
                <p class="text-sm mt-1 ${answer.correct ? 'text-green-700' : 'text-red-700'}">
                  Pregunta ${state.currentQuestion + 1}/15
                </p>
              </div>
            </div>

            <div class="bg-white rounded-lg p-6 mb-6 border-l-4 border-gray-400">
              <p class="whitespace-pre-line text-gray-800 text-sm leading-relaxed font-mono">
                ${state.feedback.explanation}
              </p>
            </div>

            <button onclick="handleNextQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition">
              ${state.currentQuestion < questions.length - 1 ? 'Siguiente Pregunta' : 'Ver Resultados'} →
            </button>
          </div>
        </div>
      `;
      return html;
    }

    // RENDER QUESTION
    function renderQuestion() {
      const question = questions[state.currentQuestion];
      const progressPercent = ((state.currentQuestion + 1) / questions.length) * 100;

      const html = `
        <div class="max-w-4xl mx-auto p-6 min-h-screen">
          <div class="bg-white rounded-lg shadow-lg p-6 mb-6 border-l-4 border-indigo-600">
            <div class="flex justify-between items-start mb-4">
              <div>
                <p class="text-xs font-semibold text-indigo-600 uppercase">Pregunta ${state.currentQuestion + 1}/15</p>
                <p class="text-sm text-gray-600 mt-1">${question.category}</p>
              </div>
              <div class="text-right">
                <p class="text-xs text-gray-500 uppercase">Tipo</p>
                <p class="text-lg font-bold text-indigo-900">${question.type.toUpperCase().replace(/-/g, ' ')}</p>
              </div>
            </div>
            
            <div class="w-full bg-gray-200 rounded-full h-2">
              <div class="bg-indigo-600 h-2 rounded-full transition-all" style="width: ${progressPercent}%"></div>
            </div>
          </div>

          <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <h2 class="text-lg font-bold text-gray-900 mb-6 leading-relaxed">${question.question}</h2>
            
            <div class="space-y-3">
              ${question.options.map((option, idx) => `
                <button onclick="handleAnswer(${idx})" class="w-full text-left bg-gray-50 rounded-lg border-2 border-gray-300 hover:border-indigo-500 hover:bg-indigo-50 p-4 transition-all active:scale-95">
                  <p class="font-semibold text-gray-900">${String.fromCharCode(65 + idx)}) ${option.text}</p>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="text-center text-xs text-gray-600">
            <p>Quiz Avanzado • Criterio de paso: 12/15 (80%)</p>
          </div>
        </div>
      `;
      return html;
    }

    // MAIN RENDER
    function render() {
      const app = document.getElementById('app');
      
      if (state.showResults) {
        app.innerHTML = renderResults();
      } else if (state.feedback) {
        app.innerHTML = renderFeedback();
      } else {
        app.innerHTML = renderQuestion();
      }
    }

    // GLOBAL FUNCTIONS
    window.handleAnswer = handleAnswer;
    window.handleNextQuestion = handleNextQuestion;
    window.handleReset = handleReset;

    // INITIAL RENDER
    render();
  </script>
</body>
</html>
