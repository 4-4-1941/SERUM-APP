      const casoData = casos[state.casoActual];
      const fase = casoData.fases[state.faseActual];
      const opcion = fase.opciones[indexOpcion];

      state.respuestas[`caso${state.casoActual}_fase${state.faseActual}`] = {
        correcta: opcion.correcta,
        explicacion: opcion.explicacion
      };

      if (opcion.correcta) {
        state.puntuacion += 10;
      }

      avanzar();
    }

    function avanzar() {
      const casoData = casos[state.casoActual];
      
      if (state.faseActual < casoData.fases.length - 1) {
        state.faseActual++;
      } else if (state.casoActual < casos.length - 1) {
        state.casoActual++;
        state.faseActual = 0;
      } else {
        state.terminado = true;
      }

      render();
    }

      if (state.puntuacion >= 28) return { nivel: "🟢 Excelente", color: "text-green-700", recomendacion: "Dominas protocolos de derivación/contrarreferencia MINSA" };
      if (state.puntuacion >= 21) return { nivel: "🟡 Bueno", color: "text-yellow-700", recomendacion: "Buen desempeño, revisa algunos protocolos" };
      return { nivel: "🔴 Revisar", color: "text-red-700", recomendacion: "Estudia protocolos antes de atender casos reales" };
    }

    function renderCaso() {
      const casoData = casos[state.casoActual];
      const fase = casoData.fases[state.faseActual];
      const progreso = ((state.casoActual * 3 + state.faseActual + 1) / 9) * 100;

      return `
        <div class="max-w-4xl mx-auto p-6">
          <div class="bg-white rounded-lg shadow-xl p-6 mb-6">
            <!-- HEADER -->
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-blue-900 mb-2">${casoData.titulo}</h1>
              <p class="text-gray-600">${casoData.descripcion}</p>
            </div>

            <!-- PROGRESO -->
            <div class="mb-6">
              <div class="flex justify-between text-sm mb-2">
                <span class="font-semibold text-gray-700">Decisión ${state.casoActual * 3 + state.faseActual + 1}/9</span>
                <span class="font-semibold text-blue-600">Puntuación: ${state.puntuacion}/90</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-2">
                <div class="bg-blue-600 h-2 rounded-full transition-all" style="width: ${progreso}%"></div>
              </div>
            </div>

            <!-- DATOS PACIENTE -->
            <div class="bg-blue-50 border-l-4 border-blue-600 p-4 mb-6 rounded">
              <p class="text-sm"><strong>Paciente:</strong> ${casoData.paciente} | <strong>Edad:</strong> ${casoData.edad} | <strong>Ubicación:</strong> ${casoData.ubicacion}</p>
            </div>

            <!-- FASE -->
            <div class="mb-6">
              <p class="text-sm font-semibold text-blue-600 mb-2">${fase.mes}</p>
              <p class="whitespace-pre-line text-gray-800 mb-4">${fase.presentacion}</p>
            </div>

            <!-- OPCIONES -->
            <div class="space-y-3">
              ${fase.opciones.map((opcion, idx) => `
                <button onclick="responder(${idx})" class="w-full text-left bg-gray-50 hover:bg-blue-50 border-2 border-gray-300 hover:border-blue-500 p-4 rounded-lg transition-all">
                  <p class="font-semibold text-gray-900">${String.fromCharCode(65 + idx)}) ${opcion.texto}</p>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderRespuesta() {
      const casoData = casos[state.casoActual];
      const fase = casoData.fases[state.faseActual];
      const respuesta = state.respuestas[`caso${state.casoActual}_fase${state.faseActual}`];

      return `
        <div class="max-w-4xl mx-auto p-6">
          <div class="${respuesta.correcta ? 'bg-green-50 border-2 border-green-500' : 'bg-red-50 border-2 border-red-500'} rounded-lg shadow-xl p-8">
            <div class="mb-6">
              <h2 class="text-3xl font-bold ${respuesta.correcta ? 'text-green-900' : 'text-red-900'} mb-2">
                ${respuesta.correcta ? '✓ CORRECTO' : '✗ INCORRECTO'}
              </h2>
              <p class="text-sm ${respuesta.correcta ? 'text-green-700' : 'text-red-700'}">
                Decisión ${state.casoActual * 3 + state.faseActual + 1}/9
              </p>
            </div>

            <div class="bg-white rounded-lg p-6 mb-6 border-l-4 ${respuesta.correcta ? 'border-green-500' : 'border-red-500'}">
              <p class="whitespace-pre-line text-sm leading-relaxed font-mono text-gray-800">
                ${respuesta.explicacion}
              </p>
            </div>

            <button onclick="avanzar()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition">
              ${state.terminado ? 'Ver Resultados Finales' : 'Siguiente Decisión'} →
            </button>
          </div>
        </div>
      `;
    }

    function renderResultados() {
      const interpretacion = interpretarPuntuacion();

      return `
        <div class="max-w-4xl mx-auto p-6">
          <div class="bg-white rounded-lg shadow-xl p-8">
            <h1 class="text-3xl font-bold text-center mb-8">🎓 RESULTADOS FINALES</h1>

            <div class="grid grid-cols-3 gap-4 mb-8">
              <div class="bg-blue-100 rounded-lg p-6 border-2 border-blue-600">
                <p class="text-sm text-blue-700 font-semibold">PUNTUACIÓN</p>
                <p class="text-4xl font-bold text-blue-900">${state.puntuacion}/90</p>
              </div>
              
              <div class="bg-gray-100 rounded-lg p-6 border-2 border-gray-600">
                <p class="text-sm text-gray-700 font-semibold">DESEMPEÑO</p>
                <p class="text-4xl font-bold text-gray-900">${Math.round(state.puntuacion / 90 * 100)}%</p>
              </div>
              
              <div class="bg-purple-100 rounded-lg p-6 border-2 border-purple-600">
                <p class="text-sm text-purple-700 font-semibold">NIVEL</p>
                <p class="text-2xl font-bold ${interpretacion.color}">${interpretacion.nivel}</p>
              </div>
            </div>

            <div class="bg-blue-50 border-l-4 border-blue-600 p-6 rounded-lg mb-8">
              <p class="text-lg font-semibold text-blue-900 mb-2">Interpretación</p>
              <p class="text-gray-800">${interpretacion.recomendacion}</p>
            </div>

            <div class="bg-gray-50 rounded-lg p-6 mb-8">
              <h3 class="font-semibold text-gray-900 mb-4">Análisis por Caso</h3>
              ${casos.map((caso, idxCaso) => {
                let correctas = 0;
                for (let i = 0; i < 3; i++) {
                  if (state.respuestas[`caso${idxCaso}_fase${i}`]?.correcta) correctas++;
                }
                return `
                  <div class="flex justify-between py-2 border-b text-sm">
                    <span>${caso.titulo}</span>
                    <span class="font-bold">${correctas}/3 correctas</span>
                  </div>
                `;
              }).join('')}
            </div>

            <button onclick="location.reload()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition">
              🔄 Reiniciar Simulador
            </button>
          </div>
        </div>
      `;
    }

    function render() {
      const app = document.getElementById('app');
      
      if (state.terminado) {
        app.innerHTML = renderResultados();
      } else if (state.respuestas[`caso${state.casoActual}_fase${state.faseActual}`]) {
        app.innerHTML = renderRespuesta();
      } else {
        app.innerHTML = renderCaso();
      }
    }

    window.responder = responder;
    window.avanzar = avanzar;
    render();
  </script>
</body>
</html>
