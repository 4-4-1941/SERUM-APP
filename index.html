<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERUM-APP · Plataforma Unificada Capacitación y Simulacro SERUMS</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <meta name="theme-color" content="#1e3c72">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- PANTALLA DE LOGIN (muestra hasta autenticación) -->
    <div id="login-screen" class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">📚</div>
                <h1>SERUM-APP v2.0</h1>
                <p>Plataforma Integrada: Capacitación, Casos Clínicos y Simulacro</p>
            </div>
            <form class="login-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="login-email">Correo electrónico:</label>
                    <input type="email" id="login-email" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contraseña:</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <div id="login-error" class="error-msg"></div>
                <button id="login-submit" type="submit" class="login-btn">Ingresar</button>
            </form>
            <div class="login-footer">
                <p>SERUMS 2026 — Plataforma de Preparación Clínica</p>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL (oculta hasta login exitoso) -->
    <div class="app" style="display: none;">
        <header class="header">
            <div class="logo">📚</div>
            <h1>SERUM-APP v2.0</h1>
            <p>Plataforma Integrada: Capacitación, Casos Clínicos y Simulacro</p>
            <button id="logout-btn" class="logout-btn">Salir</button>
        </header>

        <nav class="nav">
            <button class="nav-btn active" onclick="renderView('dashboard')" type="button">Tablero</button>
            <button class="nav-btn" onclick="renderView('cases')" type="button">Casos Clínicos</button>
            <button class="nav-btn" onclick="renderView('simulacro')" type="button">Simulacro (100)</button>
            <button class="nav-btn" onclick="renderView('concepts')" type="button">Conceptos Clave</button>
            <button class="nav-btn" onclick="renderView('norms')" type="button">Normativa</button>
            <button class="nav-btn" onclick="renderView('priority')" type="button">Normas Prioritarias 2026</button>
            <button class="nav-btn" onclick="renderView('decrees')" type="button">Decretos y Lineamientos</button>
            <button class="nav-btn" onclick="renderView('resources')" type="button">Recursos</button>
            <div class="nav-section-label">ENTRENAMIENTO</div>
            <button class="nav-btn" onclick="renderView('training')" type="button">Entrenamiento SERUMS</button>
            <button class="nav-btn" onclick="location.href='https://4-4-1941.github.io/SCREENING-TOOLS-SERUMS-PER--SIP/capacitacion/capacitacion.html'" type="button">Capacitación Screening</button>
            <div class="nav-section-label">ASISTENTE PROFESIONAL</div>
            <button class="nav-btn" onclick="renderView('assistant')" type="button">Formatos y oficios</button>
            <button class="nav-btn" onclick="renderView('codes')" type="button">Códigos HIS — Niño</button>
            <button class="nav-btn" onclick="renderView('screening')" type="button">Clinical Screening Toolkit</button>
        </nav>

        <main id="view-root" class="main"></main>
    </div>

    <script src="data.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
