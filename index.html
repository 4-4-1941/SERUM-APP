<script>
(function(){
var s=document.querySelector('.sidebar'),b=document.getElementById('nav-toggle'),n=document.getElementById('main-nav');
if(!s||!b||!n)return;
function set(o){s.classList.toggle('open',o);b.setAttribute('aria-expanded',String(o));b.setAttribute('aria-label',o?'Cerrar menú':'Abrir menú');document.body.style.overflow=o?'hidden':'';}
b.addEventListener('click',function(){set(!s.classList.contains('open'));});
n.addEventListener('click',function(e){if(e.target.closest('.nav-btn'))set(false);},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
window.addEventListener('resize',function(){if(window.innerWidth>1024)set(false);});
})();
</script>
