<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-CHAT-R/F · SERUMS Toolkit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .app-container { display: flex; flex-direction: column; min-height: 100vh; }
        .app-header { background: #0C3B34; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .header-back { background: none; border: none; color: white; cursor: pointer; font-size: 14px; opacity: 0.9; text-decoration: none; }
        .header-back:hover { opacity: 1; }
        .header-title { font-size: 16px; font-weight: 600; flex: 1; text-align: center; }
        .header-btn { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .header-btn:hover { background: rgba(255,255,255,0.3); }
        .container { flex: 1; max-width: 700px; margin: 0 auto; width: 100%; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { font-size: 2em; font-weight: 700; margin-bottom: 8px; color: #0C3B34; }
        header p { font-size: 0.95em; color: #666; }
        .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .question-group { margin-bottom: 20px; }
        .question-group label { display: block; font-weight: 500; margin-bottom: 10px; color: #333; font-size: 0.9em; line-height: 1.3; }
        .options { display: flex; gap: 12px; }
        .option { flex: 1; }
        .option input[type="radio"] { display: none; }
        .option input[type="radio"] + label { display: block; padding: 10px; text-align: center; border: 2px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.9em; margin: 0; }
        .option input[type="radio"]:checked + label { background: #0C3B34; color: white; border-color: #0C3B34; }
        button { padding: 12px 20px; background: #0C3B34; color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 0.95em; cursor: pointer; width: 100%; margin-top: 20px; }
        button:hover { background: #0A2E28; }
        .resultado { display: none; }
        .resultado.mostrar { display: block; }
        .score-box { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #0C3B34; text-align: center; }
        .score-value { font-size: 2.5em; font-weight: 700; color: #0C3B34; }
        .score-label { font-size: 0.9em; color: #666; margin-top: 8px; }
        .interpretacion { padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .interpretacion.positivo { background: #FFF3CD; border-left: 4px solid #FF6B6B; color: #856404; }
        .interpretacion.negativo { background: #D4EDDA; border-left: 4px solid #51CF66; color: #155724; }
        .botones-accion { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-toolkit { background: #0C3B34; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <a href="javascript:history.back()" class="header-back">← Volver</a>
            <div class="header-title">M-CHAT-R/F · SERUMS</div>
            <button class="header-btn" onclick="irAlToolkit()">📋 Toolkit</button>
        </div>
        <div class="container">
            <header>
                <h1>M-CHAT-R/F</h1>
                <p>Checklist Modificada para Autismo (16-30 meses)</p>
            </header>
            <div class="card" id="formulario">
                <form id="form-mchat">
                    <div id="preguntas-container"></div>
                    <button type="submit">Calcular Resultado</button>
                </form>
            </div>
            <div class="card resultado" id="resultado-box">
                <h2>Resultado</h2>
                <div class="score-box">
                    <div class="score-value" id="score-total">0</div>
                    <div class="score-label">Respuestas de Riesgo (0-20)</div>
                </div>
                <div id="interpretacion-box"></div>
                <div class="botones-accion">
                    <button class="btn-secondary" onclick="descargarJSON()">📥 Descargar JSON</button>
                    <button class="btn-secondary" onclick="reiniciar()">🔄 Nuevo Tamizaje</button>
                    <button class="btn-toolkit" onclick="irAlToolkit()">← Volver a Toolkit</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const SUPABASE_URL = 'https://xcfdhwqjudzngvlssyeg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjZmRod3FqdWR6bmd2bHNzeWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk1NjQ3NDAsImV4cCI6MTk5OTk5NDc0MH0.p2QSwDgAQvFaI1ztHQ2RiPHsgNRmvqYQ2JvGxGP7VvE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const preguntas = [
            "¿Cuando usted señala algo, ¿su hijo/a mira hacia donde usted está señalando?",
            "¿Ha sospechado alguna vez que su hijo/a pudiera tener una pérdida de audición?",
            "¿Su hijo/a entiende lo que dicen otros?",
            "¿Su hijo/a puede caminar?",
            "¿Su hijo/a mira a los ojos cuando le habla, juega con usted o se le pide que mire?",
            "¿Su hijo/a juega de forma que reproduce lo que ven que hacen otros?",
            "¿Su hijo/a intenta imitar los sonidos que usted hace?",
            "¿Conoce palabras de una sola sílaba?",
            "¿Su hijo/a usa gestos para comunicarse?",
            "¿Su hijo/a señala con su dedo índice?",
            "¿Cómo es el movimiento de los brazos y las manos de su hijo/a?",
            "¿Cómo es el movimiento de las manos de su hijo/a?",
            "¿Cómo camina su hijo/a?",
            "¿Su hijo/a mira a las cosas que está mirando otra persona?",
            "¿Si usted pone música, ¿su hijo/a baila?",
            "¿Le interesa a su hijo/a los otros niños/as?",
            "¿Su hijo/a le trae cosas para mostrarle algo?",
            "¿Hay algo que su hijo/a haga de manera inusual o repetitiva?",
            "¿Tiene su hijo/a alguna conducta que sea difícil de entender?",
            "¿Ha notado cosas en su hijo/a que no son típicas?"
        ];
        function irAlToolkit() { if (window.opener) { window.opener.focus(); window.close(); } else { window.history.back(); } }
        function inicializarFormulario() {
            const container = document.getElementById('preguntas-container');
            preguntas.forEach((pregunta, idx) => {
                const div = document.createElement('div');
                div.className = 'question-group';
                div.innerHTML = `<label>${idx + 1}. ${pregunta}</label><div class="options"><div class="option"><input type="radio" id="q${idx}_0" name="q${idx}" value="0" required><label for="q${idx}_0">Sí</label></div><div class="option"><input type="radio" id="q${idx}_1" name="q${idx}" value="1"><label for="q${idx}_1">No</label></div></div>`;
                container.appendChild(div);
            });
        }
        function calcularScore() {
            let score = 0;
            preguntas.forEach((_, idx) => {
                const respuesta = document.querySelector(`input[name="q${idx}"]:checked`);
                if (respuesta && parseInt(respuesta.value) === 1) score++;
            });
            return score;
        }
        function mostrarResultado(score) {
            document.getElementById('formulario').style.display = 'none';
            document.getElementById('resultado-box').classList.add('mostrar');
            document.getElementById('score-total').textContent = score;
            const esPositivo = score >= 3;
            const html = esPositivo 
                ? `<div class="interpretacion positivo"><strong>⚠️ Riesgo de TEA (≥3)</strong><br>Derivación urgente a especialista en neurodesarrollo.</div>`
                : `<div class="interpretacion negativo"><strong>✓ Bajo riesgo (&lt;3)</strong><br>Continúe con seguimiento normal.</div>`;
            document.getElementById('interpretacion-box').innerHTML = html;
            guardarEnSupabase(score);
        }
        async function guardarEnSupabase(score) {
            try {
                const respuestas = {};
                preguntas.forEach((_, idx) => { respuestas[`q${idx}`] = document.querySelector(`input[name="q${idx}"]:checked`).value; });
                await supabase.from('tamizajes_clinicos').insert({
                    test_tipo: 'M-CHAT-R/F',
                    puntaje_total: score,
                    zona_riesgo: score >= 3 ? 'POSITIVO' : 'NEGATIVO',
                    respuestas: respuestas,
                    consentimiento: true,
                    informante: 'padre_tutor'
                });
            } catch (e) { console.log('Guardado offline'); }
        }
        function descargarJSON() {
            const score = parseInt(document.getElementById('score-total').textContent);
            const respuestas = {};
            preguntas.forEach((_, idx) => { respuestas[`q${idx}`] = document.querySelector(`input[name="q${idx}"]:checked`).value; });
            const datos = { test: 'M-CHAT-R/F', fecha: new Date().toISOString(), puntaje: score, resultado: score >= 3 ? 'POSITIVO' : 'NEGATIVO', respuestas };
            const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `M-CHAT-R-F_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }
        function reiniciar() {
            document.getElementById('form-mchat').reset();
            document.getElementById('formulario').style.display = 'block';
            document.getElementById('resultado-box').classList.remove('mostrar');
            window.scrollTo(0, 0);
        }
        document.getElementById('form-mchat').addEventListener('submit', (e) => {
            e.preventDefault();
            mostrarResultado(calcularScore());
        });
        inicializarFormulario();
    </script>
</body>
</html>
