<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSC · SERUMS Toolkit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .app-header {
            background: #0C3B34;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .header-back {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.9;
            transition: opacity 0.3s;
            text-decoration: none;
        }
        .header-back:hover {
            opacity: 1;
        }
        .header-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
            text-align: center;
        }
        .header-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .header-btn:hover {
            background: rgba(255,255,255,0.3);
        }
        .container {
            flex: 1;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0C3B34;
        }
        header p {
            font-size: 0.95em;
            color: #666;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .question-group {
            margin-bottom: 20px;
        }
        .question-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
            color: #333;
            font-size: 0.9em;
            line-height: 1.3;
        }
        .options {
            display: flex;
            gap: 8px;
        }
        .option {
            flex: 1;
        }
        .option input[type="radio"] {
            display: none;
        }
        .option input[type="radio"] + label {
            display: block;
            padding: 8px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.8em;
            transition: all 0.3s;
            margin: 0;
        }
        .option input[type="radio"]:checked + label {
            background: #0C3B34;
            color: white;
            border-color: #0C3B34;
        }
        button {
            padding: 12px 20px;
            background: #0C3B34;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 20px;
        }
        button:hover {
            background: #0A2E28;
            transform: translateY(-1px);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .resultado {
            display: none;
        }
        .resultado.mostrar {
            display: block;
        }
        .score-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #0C3B34;
            text-align: center;
        }
        .score-value {
            font-size: 2.5em;
            font-weight: 700;
            color: #0C3B34;
        }
        .score-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 8px;
        }
        .interpretacion {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .interpretacion.positivo {
            background: #FFF3CD;
            border-left: 4px solid #FF6B6B;
            color: #856404;
        }
        .interpretacion.negativo {
            background: #D4EDDA;
            border-left: 4px solid #51CF66;
            color: #155724;
        }
        .botones-accion {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        .btn-toolkit {
            background: #0C3B34;
        }
        .btn-toolkit:hover {
            background: #0A2E28;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-header">
            <a href="javascript:history.back()" class="header-back">← Volver</a>
            <div class="header-title">PSC · SERUMS</div>
            <button class="header-btn" onclick="irAlToolkit()">📋 Toolkit</button>
        </div>

        <div class="container">
            <header>
                <h1>PSC</h1>
                <p>Lista de Síntomas Pediátrica (Pediatric Symptom Checklist)</p>
            </header>

            <div class="card" id="formulario">
                <form id="form-psc">
                    <div id="preguntas-container"></div>
                    <button type="submit">Calcular Resultado</button>
                </form>
            </div>

            <div class="card resultado" id="resultado-box">
                <h2>Resultado de la Evaluación</h2>
                
                <div class="score-box">
                    <div class="score-value" id="score-total">0</div>
                    <div class="score-label">Puntuación Total (0-105)</div>
                </div>

                <div id="interpretacion-box"></div>

                <div class="botones-accion">
                    <button class="btn-secondary" onclick="descargarJSON()">📥 Descargar JSON</button>
                    <button class="btn-secondary" onclick="reiniciar()">🔄 Nuevo Tamizaje</button>
                    <button class="btn-toolkit" onclick="irAlToolkit()">← Volver a Toolkit</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xcfdhwqjudzngvlssyeg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjZmRod3FqdWR6bmd2bHNzeWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk1NjQ3NDAsImV4cCI6MTk5OTk5NDc0MH0.p2QSwDgAQvFaI1ztHQ2RiPHsgNRmvqYQ2JvGxGP7VvE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const preguntas = [
            "Demanda mucha atención", "Tiene problemas de sueño", "Es muy activo, no puede quedarse quieto", "Es rudo con otras personas",
            "No le importa lastimar a otros", "Se distrae fácilmente, tiene dificultad de concentración", "Es ansioso, miedoso o preocupado",
            "Se rehúsa a compartir", "Es maleducado con adultos", "Culpa a otros por sus problemas", "Tiene recuerdos dolorosos y no se los puede sacar de la mente",
            "No entiende las emociones de otros", "Cuando se molesta, se altera demasiado", "Tiene cambios drásticos de humor",
            "No muestra remordimiento o culpa después de portarse mal", "Tiene dificultad para entender lo que escucha", "Tiene bajo rendimiento en la escuela",
            "Parece triste, infeliz", "Ama demasiado, se apega excesivamente a personas adultas", "Dice ser malo o sin valor",
            "Se queja de dolores y achaques", "Se preocupa por cosas que sucedieron en el pasado", "Es rechazado por otros niños",
            "Se niega a ir a la escuela", "Se queja de ser solo", "Es confundido, parece estar en otro mundo", "Es tímido",
            "Tiene miedo de cometer errores", "Es impulsivo y actúa sin pensar", "Tiene dificultad para mantener amistades",
            "Tiene baja autoestima", "Rompe reglas en el hogar, en la escuela o en otros lugares", "No participa en actividades normales de su edad",
            "Ha sido suspendido de la escuela", "Ha pensado en lastimarse a sí mismo"
        ];

        function irAlToolkit() {
            if (window.opener) {
                window.opener.focus();
                window.close();
            } else {
                window.history.back();
            }
        }

        function inicializarFormulario() {
            const container = document.getElementById('preguntas-container');
            preguntas.forEach((pregunta, idx) => {
                const div = document.createElement('div');
                div.className = 'question-group';
                div.innerHTML = `
                    <label>${idx + 1}. ${pregunta}</label>
                    <div class="options">
                        <div class="option">
                            <input type="radio" id="q${idx}_0" name="q${idx}" value="0" required>
                            <label for="q${idx}_0">Nunca</label>
                        </div>
                        <div class="option">
                            <input type="radio" id="q${idx}_1" name="q${idx}" value="1">
                            <label for="q${idx}_1">A veces</label>
                        </div>
                        <div class="option">
                            <input type="radio" id="q${idx}_2" name="q${idx}" value="2">
                            <label for="q${idx}_2">A menudo</label>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function calcularScore() {
            let score = 0;
            preguntas.forEach((_, idx) => {
                const respuesta = document.querySelector(`input[name="q${idx}"]:checked`);
                if (respuesta) score += parseInt(respuesta.value);
            });
            return score;
        }

        function mostrarResultado(score) {
            const form = document.getElementById('formulario');
            const resultBox = document.getElementById('resultado-box');
            const interpretBox = document.getElementById('interpretacion-box');
            
            form.style.display = 'none';
            resultBox.classList.add('mostrar');
            document.getElementById('score-total').textContent = score;

            const esPositivo = score >= 28;
            const html = esPositivo 
                ? `<div class="interpretacion positivo"><strong>⚠️ Puntuación elevada (≥28)</strong><br>Sugiere posibles problemas emocionales o conductuales. Requiere evaluación clínica especializada.</div>`
                : `<div class="interpretacion negativo"><strong>✓ Puntuación normal (&lt;28)</strong><br>No sugiere problemas significativos. Continúe con seguimiento.</div>`;
            
            interpretBox.innerHTML = html;
            guardarEnSupabase(score);
        }

        async function guardarEnSupabase(score) {
            try {
                const respuestas = {};
                preguntas.forEach((_, idx) => {
                    respuestas[`q${idx}`] = document.querySelector(`input[name="q${idx}"]:checked`).value;
                });

                await supabase
                    .from('tamizajes_clinicos')
                    .insert({
                        test_tipo: 'PSC',
                        puntaje_total: score,
                        zona_riesgo: score >= 28 ? 'POSITIVO' : 'NEGATIVO',
                        respuestas: respuestas,
                        consentimiento: true,
                        informante: 'padre_tutor'
                    });
            } catch (e) {
                console.log('Nota: Guardado offline');
            }
        }

        function descargarJSON() {
            const score = parseInt(document.getElementById('score-total').textContent);
            const respuestas = {};
            preguntas.forEach((_, idx) => {
                respuestas[`q${idx}`] = document.querySelector(`input[name="q${idx}"]:checked`).value;
            });
            
            const datos = {
                test: 'PSC',
                fecha: new Date().toISOString(),
                puntaje: score,
                resultado: score >= 28 ? 'POSITIVO' : 'NEGATIVO',
                respuestas
            };

            const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `PSC_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function reiniciar() {
            document.getElementById('form-psc').reset();
            document.getElementById('formulario').style.display = 'block';
            document.getElementById('resultado-box').classList.remove('mostrar');
            window.scrollTo(0, 0);
        }

        document.getElementById('form-psc').addEventListener('submit', (e) => {
            e.preventDefault();
            const score = calcularScore();
            mostrarResultado(score);
        });

        inicializarFormulario();
    </script>
</body>
</html>
