<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSC · Tamizaje Pediátrico</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 8px;
        }
        header p {
            font-size: 0.95em;
            opacity: 0.9;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            margin-bottom: 20px;
        }
        .question-group {
            margin-bottom: 24px;
        }
        .question-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 12px;
            color: #333;
            font-size: 0.95em;
            line-height: 1.4;
        }
        .options {
            display: flex;
            gap: 8px;
        }
        .option {
            flex: 1;
        }
        .option input[type="radio"] {
            display: none;
        }
        .option input[type="radio"] + label {
            display: block;
            padding: 10px;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85em;
            transition: all 0.3s;
            margin: 0;
        }
        .option input[type="radio"]:checked + label {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .resultado {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        .resultado.mostrar {
            display: block;
        }
        .score-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .score-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
        }
        .score-label {
            font-size: 0.85em;
            color: #666;
            margin-top: 8px;
        }
        .interpretacion {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .interpretacion.positivo {
            background: #fee;
            border-left: 4px solid #d32f2f;
            color: #b71c1c;
        }
        .interpretacion.negativo {
            background: #efe;
            border-left: 4px solid #388e3c;
            color: #1b5e20;
        }
        .botones-accion {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-secondary {
            flex: 1;
            background: #e0e0e0;
            color: #333;
        }
        .btn-secondary:hover {
            background: #d0d0d0;
        }
        .nav-back {
            color: white;
            text-decoration: none;
            font-size: 0.9em;
            margin-bottom: 20px;
            display: inline-block;
            opacity: 0.9;
            transition: opacity 0.3s;
        }
        .nav-back:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="./index.html" class="nav-back">← Volver a Tamizaje</a>
        
        <header>
            <h1>PSC</h1>
            <p>Lista de Síntomas Pediátrica (Pediatric Symptom Checklist)</p>
        </header>

        <div class="card" id="formulario">
            <form id="form-psc">
                <div id="preguntas-container"></div>
                <button type="submit">Calcular Resultado</button>
            </form>
        </div>

        <div class="card resultado" id="resultado-box">
            <h2>Resultado de la Evaluación</h2>
            
            <div class="score-box">
                <div class="score-value" id="score-total">0</div>
                <div class="score-label">Puntuación Total (0-105)</div>
            </div>

            <div id="interpretacion-box"></div>

            <div class="botones-accion">
                <button class="btn-secondary" onclick="descargarJSON()">📥 Descargar JSON</button>
                <button class="btn-secondary" onclick="reiniciar()">🔄 Nuevo Tamizaje</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xcfdhwqjudzngvlssyeg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjZmRod3FqdWR6bmd2bHNzeWVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE2OTk1NjQ3NDAsImV4cCI6MTk5OTk5NDc0MH0.p2QSwDgAQvFaI1ztHQ2RiPHsgNRmvqYQ2JvGxGP7VvE';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const preguntas = [
            "Demanda mucha atención",
            "Tiene problemas de sueño",
            "Es muy activo, no puede quedarse quieto",
            "Es rudo con otras personas",
            "No le importa lastimar a otros",
            "Se distrae fácilmente, tiene dificultad de concentración",
            "Es ansioso, miedoso o preocupado",
            "Se rehúsa a compartir",
            "Es maleducado con adultos",
            "Culpa a otros por sus problemas",
            "Tiene recuerdos dolorosos y no se los puede sacar de la mente",
            "No entiende las emociones de otros",
            "Cuando se molesta, se altera demasiado",
            "Tiene cambios drásticos de humor",
            "No muestra remordimiento o culpa después de portarse mal",
            "Tiene dificultad para entender lo que escucha",
            "Tiene bajo rendimiento en la escuela",
            "Parece triste, infeliz",
            "Ama demasiado, se apega excesivamente a personas adultas",
            "Dice ser malo o sin valor",
            "Se queja de dolores y achaques",
            "Se preocupa por cosas que sucedieron en el pasado",
            "Es rechazado por otros niños",
            "Se niega a ir a la escuela",
            "Se queja de ser solo",
            "Es confundido, parece estar en otro mundo",
            "Es tímido",
            "Tiene miedo de cometer errores",
            "Es impulsivo y actúa sin pensar",
            "Tiene dificultad para mantener amistades",
            "Tiene baja autoestima",
            "Rompe reglas en el hogar, en la escuela o en otros lugares",
            "No participa en actividades normales de su edad",
            "Ha sido suspendido de la escuela",
            "Ha pensado en lastimarse a sí mismo"
        ];

        function inicializarFormulario() {
            const container = document.getElementById('preguntas-container');
            preguntas.forEach((pregunta, idx) => {
                const div = document.createElement('div');
                div.className = 'question-group';
                div.innerHTML = `
                    <label>${idx + 1}. ${pregunta}</label>
                    <div class="options">
                        <div class="option">
                            <input type="radio" id="q${idx}_0" name="q${idx}" value="0" required>
                            <label for="q${idx}_0">Nunca</label>
                        </div>
                        <div class="option">
                            <input type="radio" id="q${idx}_1" name="q${idx}" value="1">
                            <label for="q${idx}_1">A veces</label>
                        </div>
                        <div class="option">
                            <input type="radio" id="q${idx}_2" name="q${idx}" value="2">
                            <label for="q${idx}_2">A menudo</label>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function calcularScore() {
            let score = 0;
            preguntas.forEach((_, idx) => {
                const respuesta = document.querySelector(`input[name="q${idx}"]:checked`);
                if (respuesta) {
                    score += parseInt(respuesta.value);
                }
            });
            return score;
        }

        function mostrarResultado(score) {
            const form = document.getElementById('formulario');
            const resultBox = document.getElementById('resultado-box');
            const interpretBox = document.getElementById('interpretacion-box');
            
            form.style.display = 'none';
            resultBox.classList.add('mostrar');
            document.getElementById('score-total').textContent = score;

            const esPositivo = score >= 28;
            const html = esPositivo 
                ? `<div class="interpretacion positivo">
                    <strong>⚠️ Puntuación elevada (≥28)</strong><br>
                    Sugiere posibles problemas emocionales o conductuales. Se recomienda evaluación clínica más detallada con especialista en psicología infantil.
                   </div>`
                : `<div class="interpretacion negativo">
                    <strong>✓ Puntuación normal (&lt;28)</strong><br>
                    No sugiere problemas emocionales o conductuales significativos. Continúe con seguimiento preventivo.
                   </div>`;
            
            interpretBox.innerHTML = html;
            guardarEnSupabase(score, esPositivo);
        }

        async function guardarEnSupabase(score, esPositivo) {
            try {
                const respuestas = {};
                preguntas.forEach((_, idx) => {
                    respuestas[`q${idx}`] = document.querySelector(`input[name="q${idx}"]:checked`).value;
                });

                await supabase
                    .from('tamizajes_clinicos')
                    .insert({
                        test_tipo: 'PSC',
                        puntaje_total: score,
                        zona_riesgo: esPositivo ? 'POSITIVO' : 'NEGATIVO',
                        respuestas: respuestas,
                        consentimiento: true,
                        informante: 'padre_tutor'
                    });
            } catch (e) {
                console.log('Supabase guardado (offline):', e.message);
            }
        }

        function descargarJSON() {
            const score = parseInt(document.getElementById('score-total').textContent);
            const respuestas = {};
            preguntas.forEach((_, idx) => {
                respuestas[`q${idx}`] = document.querySelector(`input[name="q${idx}"]:checked`).value;
            });
            
            const datos = {
                test: 'PSC',
                fecha: new Date().toISOString(),
                puntaje_total: score,
                resultado: score >= 28 ? 'POSITIVO' : 'NEGATIVO',
                respuestas
            };

            const blob = new Blob([JSON.stringify(datos, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `PSC_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function reiniciar() {
            document.getElementById('form-psc').reset();
            document.getElementById('formulario').style.display = 'block';
            document.getElementById('resultado-box').classList.remove('mostrar');
            window.scrollTo(0, 0);
        }

        document.getElementById('form-psc').addEventListener('submit', (e) => {
            e.preventDefault();
            const score = calcularScore();
            mostrarResultado(score);
        });

        inicializarFormulario();
    </script>
</body>
</html>
